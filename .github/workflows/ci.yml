name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-build-tvos:
    name: Analyze & Build tvOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # flutter analyze 默认把 info 级 lint 视为 fatal（exit 1），
        # 这里只让 error 级问题导致失败，info 提示不阻塞构建。
        run: flutter analyze --no-fatal-infos

      - name: Build tvOS
        run: flutter build ios --platform=tvos --no-codesign
