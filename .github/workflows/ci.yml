name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-build-tvos:
    name: Analyze & Build tvOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build tvOS
        run: flutter build ios --platform=tvos --no-codesign
