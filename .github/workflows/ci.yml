name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-build-tvos:
    name: Analyze & Build tvOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # flutter analyze 默认把 info/warning 级 lint 视为 fatal（exit 1）。
        # 本阶段以"tvOS 可编译"为首要目标，只让 error 级问题阻塞构建，
        # info/warning 提示打印出来供人工清理，不阻断 CI。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build tvOS
        run: flutter build ios --platform=tvos --no-codesign
