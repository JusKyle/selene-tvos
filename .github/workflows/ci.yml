name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-build-tvos:
    name: Analyze & Build tvOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方 Flutter 不提供 tvOS 构建（无 --platform=tvos）。
      # 使用社区 flutter-tvos fork（github.com/fluttertv/flutter-tvos），
      # 它提供 flutter-tvos 命令：create/run/build 均以 tvOS 为目标。
      # 首次运行 flutter-tvos 会自动 clone 并 pin 到 Flutter 3.47.1 SDK，
      # 编译工具快照，随后 precache 下载 tvOS 引擎产物（耗时约 5-10 分钟）。
      - name: Install flutter-tvos (v3.47.1-tvos.1.7.0)
        run: |
          git clone --depth 1 --branch v3.47.1-tvos.1.7.0 \
            https://github.com/fluttertv/flutter-tvos.git "$HOME/flutter-tvos"
          echo "$HOME/flutter-tvos/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH 只对后续步骤生效，本步骤内需用全路径调用
          "$HOME/flutter-tvos/bin/flutter-tvos" precache

      # fork 内置的 Flutter SDK 与原版一致（纯 Dart 分析，与平台无关）。
      - name: Analyze
        run: |
          "$HOME/flutter-tvos/flutter/bin/flutter" analyze --no-fatal-infos --no-fatal-warnings

      # 仓库不提交 tvos/（不完整且 fork 的 create 遇到已存在目录会跳过），
      # 由 fork 模板在 CI 上生成完整 tvOS Xcode 工程（含 project.pbxproj）。
      - name: Scaffold tvOS project
        run: flutter-tvos create --platforms=tvos .

      # 模拟器 debug 构建无需代码签名；编译全部 Dart 并预置引擎 payload。
      - name: Build tvOS (simulator, debug)
        run: flutter-tvos build tvos --simulator

      # 在本机无需 Xcode 即可看效果：boot 一台 tvOS 模拟器，安装并启动 app，
      # 多时间点截图 + 进程存活检查 + 收集日志，作为 artifact 上传诊断。
      - name: Screenshot tvOS simulator
        run: |
          set -e
          APP=$(find build -name Runner.app -type d | head -1)
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          # 选一台可用的 Apple TV 模拟器
          TV_UDID=$(xcrun simctl list devices available | grep -i "Apple TV" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          echo "App: $APP"
          echo "Bundle ID: $BUNDLE_ID"
          echo "TV UDID: $TV_UDID"
          if [ -z "$TV_UDID" ]; then
            echo "::error::No tvOS simulator device available"
            exit 1
          fi
          xcrun simctl boot "$TV_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$TV_UDID" -b
          xcrun simctl install "$TV_UDID" "$APP"
          xcrun simctl launch "$TV_UDID" "$BUNDLE_ID"
          mkdir -p /tmp/shots
          # 10s / 30s / 60s 三张截图，判断首帧渲染时间
          PREV=0
          for T in 10 30 60; do
            sleep $(( T - PREV ))
            xcrun simctl io "$TV_UDID" screenshot "/tmp/shots/shot_${T}s.png" 2>/dev/null || echo "::warning::shot ${T}s failed"
            PREV=$T
          done
          # 检查 app 进程是否存活（崩溃检测）
          if xcrun simctl spawn "$TV_UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
            echo "App process alive after 60s"
          else
            echo "::warning::App process NOT found after 60s (likely crashed)"
          fi
          # 收集最近 2 分钟 app 相关日志，辅助排查空白/崩溃
          xcrun simctl spawn "$TV_UDID" log show --last 2m --style compact 2>/dev/null \
            | grep -iE "Runner|flutter|crash|exception|fatal" | head -80 > /tmp/shots/app_log.txt || true
          echo "Log lines: $(wc -l < /tmp/shots/app_log.txt 2>/dev/null || echo 0)"

      - name: Upload tvOS screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tvos-simulator-screenshot
          path: /tmp/shots
          if-no-files-found: error
